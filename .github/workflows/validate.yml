name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML structure & accessibility
        run: npm run lint:html

      - name: Verify all internal and external links
        uses: lycheeverse/lychee-action@2b973e86ec7b1f5b8356a62429c679d505990264 # v2.3.0
        with:
          args: "--verbose --no-progress --max-concurrency 8 ./**/*.html"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
